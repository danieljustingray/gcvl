<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Toetsrooster 4VWO - TW4</title>
  <link rel="icon" href="278.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
    }
    h1, p {
      margin: 20px;
    }
    .middlediv {margin: 20px;}
    #myInput {
      width: 100%;
      font-size: 16px;
      padding: 20px 20px 20px 50px;
      border: 1px solid #ddd;
      margin-bottom: 12px;
      background-image: url(search.png);
      background-position: left;
      background-size: 39px;
      background-repeat: no-repeat;
    }
    .unactive {
      color: grey;
    }
  </style>
</head>
<body>
<button id="accessibility-toggle">☰</button>
  <div id="accessibility-controls">
    <button onclick="changeFontSize(1)">A+</button>
    <button onclick="changeFontSize(-1)">A-</button>
    <button onclick="resetFontSize()">Reset</button>
    <button onclick="sortTable()">Sorteer alfabetisch volgorde</button>
    <button onclick="removeAllCSS()">CSS weghalen</button>
  </div>
<h1>4 VWO Portaal - TW4</h1>
<p>Welkom bij de portaal voor de afdeling 4 VWO! Alle info omtrent school en overgaan staat hierin!</p>
<div class="middlediv">
  <input type="text" id="myInput" onkeyup="myFunction()" placeholder="Wat zoek je?">
  <table id="myTable">
    <thead>
      <tr>
        <th>Naam</th>
      </tr>
    </thead>
    <tbody>
        <tr><td><a href="tw4/index.html" class="full-cell-link">Toetsweek 4 rooster 2024/2025</a></td></tr>
        <tr><td><a href="https://griftland.nl/wp-content/uploads/2025/03/ptas-4vwo-2425-27-jan-25.pdf" target="blank" class="full-cell-link">PTA</a></td></tr>
    </tbody>
  </table>
</div>
<p><i>Made possible by <a href="http://soppyinc.com" target="_blank">Soppy Inc.</a>&nbsp;&nbsp;<a href="https://coff.ee/danielgray" target="_blank"><img src="../images/buymeacoffee.png" width="100"></a></i></p>
</body>
<script src="script.js"></script>
<script>
function myFunction() {
  // Declare variables
  var input, filter, table, tr, td, i, txtValue;
  input = document.getElementById("myInput");
  filter = input.value.toUpperCase();
  table = document.getElementById("myTable");
  tr = table.getElementsByTagName("tr");

  // Loop through all table rows, and hide those who don't match the search query
  for (i = 0; i < tr.length; i++) {
    td = tr[i].getElementsByTagName("td")[0];
    if (td) {
      txtValue = td.textContent || td.innerText;
      if (txtValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }
    }
  }
}
function sortTable() {
  var table, rows, switching, i, x, y, shouldSwitch;
  table = document.getElementById("myTable");
  switching = true;
  /*Make a loop that will continue until
  no switching has been done:*/
  while (switching) {
    //start by saying: no switching is done:
    switching = false;
    rows = table.rows;
    /*Loop through all table rows (except the
    first, which contains table headers):*/
    for (i = 1; i < (rows.length - 1); i++) {
      //start by saying there should be no switching:
      shouldSwitch = false;
      /*Get the two elements you want to compare,
      one from current row and one from the next:*/
      x = rows[i].getElementsByTagName("TD")[0];
      y = rows[i + 1].getElementsByTagName("TD")[0];
      //check if the two rows should switch place:
      if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
        //if so, mark as a switch and break the loop:
        shouldSwitch = true;
        break;
      }
    }
    if (shouldSwitch) {
      /*If a switch has been marked, make the switch
      and mark that a switch has been done:*/
      rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
      switching = true;
    }
  }
}
</script>
</html>
