<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>De Grote Quiz</title>
<style>
  /*
    Ontwerp: helder, toegankelijk, met een vleugje 2008 web-gevoel
    (gestreepte voortgangsbalk, bevelde knoppen, vlakke kleurvlakken
    i.p.v. glas/bubbels), maar met moderne toegankelijkheidsnormen:
    sterk contrast, duidelijke focusstaat, geen overbodige beweging.
  */
  :root{
    --bg:#eef2f6;
    --surface:#ffffff;
    --surface-soft:#f5f8fb;
    --ink:#16212a;
    --ink-soft:#3f5160;
    --border:#c3cfd9;
    --border-strong:#8fa3b3;

    --primary:#155a87;
    --primary-dark:#0e3f5f;
    --primary-tint:#dceefb;

    --accent:#2f7d32;
    --accent-dark:#1f5722;
    --accent-tint:#e1f3e0;

    --warn:#a32f22;
    --warn-dark:#7c2419;
    --warn-tint:#fbe3df;

    --focus:#b3690a;

    font-family:Verdana, Arial, "Segoe UI", sans-serif;
  }

  *{ box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    background:var(--bg);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 56px;
  }

  .quiz-shell{
    width:100%;
    max-width:640px;
  }

  /* ---- Header / tracker ---- */
  .quiz-header{
    text-align:center;
    margin-bottom:20px;
  }

  .eyebrow{
    font-family:"Trebuchet MS", Verdana, sans-serif;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:12px;
    color:var(--primary-dark);
    font-weight:bold;
    margin:0 0 6px;
  }

  h1{
    font-family:"Trebuchet MS", Verdana, sans-serif;
    font-weight:bold;
    font-size:clamp(22px, 6vw, 30px);
    margin:0 0 16px;
    color:var(--ink);
  }

  .tracker{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    justify-content:center;
    list-style:none;
    padding:0;
    margin:0;
  }

  .tracker li{
    width:20px;
    height:12px;
    border-radius:3px;
    background:var(--surface);
    border:1px solid var(--border-strong);
  }

  .tracker li.done{
    background:var(--primary);
    border-color:var(--primary-dark);
  }

  .tracker li.current{
    background:var(--accent);
    border-color:var(--accent-dark);
    outline:2px solid var(--focus);
    outline-offset:1px;
  }

  /* ---- Card ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:clamp(18px, 5vw, 32px);
    box-shadow:0 2px 0 var(--border), 0 8px 18px rgba(22,33,42,0.08);
  }

  .meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 10px;
  }

  .q-count{
    font-family:"Trebuchet MS", Verdana, sans-serif;
    font-size:13px;
    font-weight:bold;
    color:var(--primary-dark);
    margin:0;
  }

  .category-badge{
    font-size:11px;
    font-weight:bold;
    color:#ffffff;
    background:var(--primary);
    border:1px solid var(--primary-dark);
    padding:4px 10px;
    border-radius:12px;
  }

  .stars{
    font-size:13px;
    letter-spacing:1px;
    color:var(--focus);
  }

  .sr-only-stars{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
  }

  .q-text{
    font-size:clamp(17px, 4.4vw, 20px);
    line-height:1.5;
    margin:8px 0 20px;
    font-weight:bold;
    color:var(--ink);
  }

  fieldset.options{
    display:flex;
    flex-direction:column;
    gap:10px;
    border:none;
    margin:0;
    padding:0;
  }

  fieldset.options legend{
    position:absolute;
    left:-9999px;
  }

  .option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    background:var(--surface-soft);
    border:1px solid var(--border);
  }

  .option:hover{ background:var(--primary-tint); border-color:var(--border-strong); }

  .option .opt-letter{
    width:26px; height:26px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:bold; color:var(--primary-dark);
  }

  .option input{
    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
  }

  .option.selected{
    background:var(--primary-tint);
    border-color:var(--primary);
  }

  .option.selected .opt-letter{
    background:var(--primary);
    color:#ffffff;
    border-color:var(--primary-dark);
  }

  .option:has(input:focus-visible){
    outline:3px solid var(--focus);
    outline-offset:2px;
  }

  /* Fallback focus ring for browsers without :has() support */
  .option input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }

  /* ---- Identity fields ---- */
  .field{ margin-bottom:16px; }

  .field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    background:var(--surface);
    border:1px solid var(--border-strong);
  }

  .field input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:1px;
  }

  .intro-blurb{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 20px;
    line-height:1.5;
  }

  /* ---- Nav buttons (slight 2008 bevel, flat & high-contrast) ---- */
  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:24px;
  }

  button{
    font-family:"Trebuchet MS", Verdana, sans-serif;
    font-size:15px;
    font-weight:bold;
    border-radius:8px;
    padding:12px 24px;
    cursor:pointer;
    flex:1;
    max-width:220px;
  }

  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  button:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }

  .btn-primary{
    background:var(--accent);
    color:#ffffff;
    border:1px solid var(--accent-dark);
    box-shadow:0 2px 0 var(--accent-dark);
  }
  .btn-primary:hover:not(:disabled){ background:var(--accent-dark); }

  .btn-ghost{
    background:var(--surface);
    color:var(--ink-soft);
    border:1px solid var(--border-strong);
    flex:0 0 auto;
  }
  .btn-ghost:hover{ background:var(--surface-soft); }

  /* ---- Result screen ---- */
  .result{ text-align:center; }

  .score-big{
    font-family:"Trebuchet MS", Verdana, sans-serif;
    font-size:clamp(40px, 12vw, 54px);
    font-weight:bold;
    margin:6px 0;
    color:var(--primary-dark);
  }

  .score-label{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:18px;
    font-weight:bold;
  }

  .status-line{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:bold;
    padding:8px 16px;
    border-radius:8px;
    margin-bottom:18px;
    border:1px solid transparent;
  }

  .status-line.ok{ background:var(--accent-tint); color:var(--accent-dark); border-color:var(--accent-dark); }
  .status-line.err{ background:var(--warn-tint); color:var(--warn-dark); border-color:var(--warn-dark); }
  .status-line.pending{ background:var(--primary-tint); color:var(--primary-dark); border-color:var(--primary-dark); }

  .review{
    text-align:left;
    margin-top:22px;
    border-top:1px dashed var(--border-strong);
    padding-top:16px;
  }

  .review-item{
    padding:11px 0;
    border-bottom:1px dashed var(--border);
    font-size:14px;
    line-height:1.5;
  }

  .review-item:last-child{ border-bottom:none; }

  .review-item .tag{ font-weight:bold; margin-right:6px; }
  .tag.correct{ color:var(--accent-dark); }
  .tag.incorrect{ color:var(--warn-dark); }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:18px;
  }

  /* ---- Mobile tightening ---- */
  @media (max-width:480px){
    body{ padding:20px 12px 48px; }
    .nav-row{ flex-direction:column-reverse; }
    button{ max-width:none; width:100%; }
    .btn-ghost{ flex:1; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* ---- High contrast / forced-colors support ---- */
  @media (forced-colors: active){
    .option, .card, button, .field input{ border:1px solid CanvasText; }
  }
</style>
</head>
<body>

<div class="quiz-shell">
  <div class="quiz-header">
    <p class="eyebrow">Quiz</p>
    <h1 id="quizTitle">De Grote Quiz</h1>
    <ul class="tracker" id="tracker" aria-label="Voortgang"></ul>
  </div>

  <div class="card" id="card" role="region" aria-live="polite" aria-label="Quizvraag"></div>

  <footer>Je antwoorden worden opgeslagen zodra je klaar bent. Geen account nodig.</footer>
</div>

<script>
const QUIZ = {
  title: "De Grote Quiz \ud83c\udfaf",
  questions: [
    { category:"TV", difficulty:2,
      text:"Wie speelt het personage Michael Scott in de Amerikaanse versie van The Office?",
      options:["Steve Carell","John Krasinski","Rainn Wilson","Ed Helms"], correct:0 },
    { category:"Wetenschap", difficulty:1,
      text:"Wat is de chemische formule van water?",
      options:["CO2","H2O","O2","NaCl"], correct:1 },
    { category:"Aardrijkskunde", difficulty:2,
      text:"Welke rivier stroomt door Londen?",
      options:["Rijn","Seine","Theems","Donau"], correct:2 },
    { category:"Technologie", difficulty:3,
      text:"Welke programmeertaal wordt vaak gebruikt voor websites aan de kant van de browser?",
      options:["JavaScript","Python","C++","Excel"], correct:0 },
    { category:"Sport", difficulty:1,
      text:"Hoeveel spelers staan er per team op het veld bij voetbal tijdens de wedstrijd?",
      options:["9","10","11","12"], correct:2 },
    { category:"Technologie", difficulty:2,
      text:"Wat betekent .. / -- .. ... ... / -. -- --- ..- in morsecode?",
      options:["I must see","SOS","Yes","I miss you"], correct:4 },
    { category:"Muziek", difficulty:2,
      text:"Welke artiest bracht het album \"Thriller\" uit?",
      options:["Elvis Presley","Michael Jackson","Freddie Mercury","Eminem"], correct:1 },
    { category:"Ruimte", difficulty:2,
      text:"Hoe heet de grootste planeet van ons zonnestelsel?",
      options:["Saturnus","Jupiter","Neptunus","Uranus"], correct:1 },
    { category:"Economie", difficulty:3,
      text:"Waar staat de afkorting BTW voor?",
      options:["Belasting Toegevoegde Waarde","Bedrijfseigen Tijd Wet","Binnenlandse Tarief Waarde","Basis Totaal Winst"], correct:0 },
    { category:"Literatuur", difficulty:2,
      text:"Welke schrijver schreef de fantasyreeks \"In de ban van de Ring\" (The Lord of the Rings)?",
      options:["George R.R. Martin","J.R.R. Tolkien","C.S. Lewis","Terry Pratchett"], correct:1 },
    { category:"Geschiedenis", difficulty:4,
      text:"Welke gebeurtenis vond plaats in 1492?",
      options:["De val van het Romeinse Rijk","De ontdekking van Amerika door Columbus","De Franse Revolutie","De maanlanding"], correct:1 },
    { category:"Wetenschap", difficulty:4,
      text:"Welke bloedgroep wordt vaak de universele donor genoemd?",
      options:["AB+","O-","A+","B-"], correct:1 },
    { category:"Algemene kennis", difficulty:3,
      text:"Wat is de officiele munteenheid van Zuid-Afrika?",
      options:["Rand","Pula","Naira","Cedi"], correct:0 },
    { category:"Wiskunde", difficulty:5,
      text:"Gegeven: x + y = 12 en x - y = 4. Wat is de waarde van x \u00d7 y?",
      options:["32","48","16","24"], correct:0 },
    { category:"Eindvraag", difficulty:4,
      text:"Welke Nederlandse provincie heeft de meeste inwoners?",
      options:["Noord-Holland","Zuid-Holland","Utrecht","Gelderland"], correct:1 }
  ]
};

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygTwVyJrwDdzcJAD_Ls-Xpnqa-kHuZDsOOWv27IVuiAQe0e1m_rRL-F1VWA0OKbfE6/exec";

document.getElementById('quizTitle').textContent = QUIZ.title;
const LETTERS = ["A","B","C","D","E"];

const state = {
  step: -1,
  name: "",
  answers: new Array(QUIZ.questions.length).fill(null),
  submitted: false,
  submitStatus: "idle"
};

const card = document.getElementById('card');
const tracker = document.getElementById('tracker');

function stars(n){
  const filled = "\u2605".repeat(n);
  const empty = "\u2606".repeat(5 - n);
  return `<span aria-hidden="true">${filled}${empty}</span><span class="sr-only-stars">Moeilijkheidsgraad ${n} van 5</span>`;
}

function renderTracker(){
  tracker.innerHTML = "";
  QUIZ.questions.forEach((_, i) => {
    const item = document.createElement('li');
    item.className = (state.answers[i] !== null ? 'done' : '') + (i === state.step ? ' current' : '');
    const label = document.createElement('span');
    label.className = 'sr-only-stars';
    label.textContent = `Vraag ${i + 1}${state.answers[i] !== null ? ', beantwoord' : ''}${i === state.step ? ', huidige vraag' : ''}`;
    item.appendChild(label);
    tracker.appendChild(item);
  });
}

function renderIdentity(){
  card.innerHTML = `
    <p class="q-count">Voordat je begint</p>
    <p class="q-text">Wie ben jij?</p>
    <p class="intro-blurb">${QUIZ.questions.length} vragen, uiteenlopende moeilijkheidsgraad. Veel succes!</p>
    <div class="field">
      <label for="nameInput">Naam</label>
      <input id="nameInput" type="text" placeholder="Jan Jansen" value="${state.name}" autocomplete="name">
    </div>
    <div class="nav-row">
      <span></span>
      <button class="btn-primary" id="startBtn" type="button">Start de quiz</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = () => {
    state.name = document.getElementById('nameInput').value.trim();
    if(!state.name){ alert("Vul je naam in."); document.getElementById('nameInput').focus(); return; }
    state.step = 0;
    render();
  };
}

function renderQuestion(){
  const q = QUIZ.questions[state.step];
  const selected = state.answers[state.step];

  const optionsHtml = q.options.map((opt, i) => `
    <label class="option ${selected === i ? 'selected' : ''}">
      <input type="radio" name="opt" value="${i}" ${selected === i ? 'checked' : ''}>
      <span class="opt-letter" aria-hidden="true">${LETTERS[i]}</span>
      <span>${opt}</span>
    </label>
  `).join('');

  card.innerHTML = `
    <div class="meta-row">
      <p class="q-count">Vraag ${state.step + 1} van ${QUIZ.questions.length}</p>
      <span class="category-badge">${q.category}</span>
    </div>
    <p class="stars">${stars(q.difficulty)}</p>
    <p class="q-text" id="questionText">${q.text}</p>
    <fieldset class="options" aria-describedby="questionText">
      <legend>Antwoordopties</legend>
      ${optionsHtml}
    </fieldset>
    <div class="nav-row">
      <button class="btn-ghost" id="backBtn" type="button" ${state.step === 0 ? 'disabled' : ''}>Terug</button>
      <button class="btn-primary" id="nextBtn" type="button" ${selected === null ? 'disabled' : ''}>
        ${state.step === QUIZ.questions.length - 1 ? 'Afronden' : 'Volgende'}
      </button>
    </div>
  `;

  card.querySelectorAll('input[name="opt"]').forEach(input => {
    input.addEventListener('change', (e) => {
      state.answers[state.step] = parseInt(e.target.value, 10);
      render();
    });
  });

  document.getElementById('backBtn').onclick = () => {
    if(state.step === 0){ state.step = -1; } else { state.step -= 1; }
    render();
  };

  document.getElementById('nextBtn').onclick = () => {
    if(state.step === QUIZ.questions.length - 1){
      state.step = QUIZ.questions.length;
      submitResults();
    } else {
      state.step += 1;
    }
    render();
  };
}

function scoreQuiz(){
  let correct = 0;
  QUIZ.questions.forEach((q, i) => {
    if(state.answers[i] === q.correct) correct += 1;
  });
  return correct;
}

function renderResult(){
  const correct = scoreQuiz();
  const total = QUIZ.questions.length;
  const pct = Math.round((correct / total) * 100);

  let statusHtml = '';
  if(state.submitStatus === 'sending'){
    statusHtml = `<div class="status-line pending">Bezig met opslaan...</div>`;
  } else if(state.submitStatus === 'ok'){
    statusHtml = `<div class="status-line ok">Antwoorden opgeslagen</div>`;
  } else if(state.submitStatus === 'error'){
    statusHtml = `<div class="status-line err">Opslaan mislukt - controleer SCRIPT_URL</div>`;
  }

  const reviewHtml = QUIZ.questions.map((q, i) => {
    const isCorrect = state.answers[i] === q.correct;
    return `
      <div class="review-item">
        <span class="tag ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Goed' : 'Fout'}</span>
        ${q.text}
        ${isCorrect ? '' : `<br><span style="color:var(--ink-soft)">Juiste antwoord: ${q.options[q.correct]}</span>`}
      </div>
    `;
  }).join('');

  card.innerHTML = `
    <div class="result">
      <p class="q-count">Resultaat voor ${state.name}</p>
      <p class="score-big">${correct}/${total}</p>
      <p class="score-label">${pct}% goed</p>
      ${statusHtml}
    </div>
    <div class="review">${reviewHtml}</div>
  `;
}

function render(){
  renderTracker();
  if(state.step === -1) renderIdentity();
  else if(state.step === QUIZ.questions.length) renderResult();
  else renderQuestion();
}

async function submitResults(){
  if(state.submitted) return;
  state.submitted = true;
  state.submitStatus = "sending";
  render();

  const correct = scoreQuiz();
  const total = QUIZ.questions.length;

  const payload = {
    name: state.name,
    score: correct,
    total: total,
    percent: Math.round((correct / total) * 100),
    answers: QUIZ.questions.map((q, i) => ({
      question: q.text,
      category: q.category,
      difficulty: q.difficulty,
      yourAnswer: state.answers[i] !== null ? q.options[state.answers[i]] : "(geen antwoord)",
      correctAnswer: q.options[q.correct],
      isCorrect: state.answers[i] === q.correct
    })),
    submittedAt: new Date().toISOString()
  };

  if(!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    state.submitStatus = "error";
    render();
    return;
  }

  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    state.submitStatus = "ok";
  } catch(err){
    state.submitStatus = "error";
  }
  render();
}

render();
</script>
</body>
</html>
